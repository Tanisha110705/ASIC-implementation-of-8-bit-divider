<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-label="eight_bit_divider top-level interface">
<title>eight_bit_divider top-level interface</title>
<defs><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4e89"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a94a3"/></marker></defs>
<rect x="0" y="0" width="960" height="470" fill="#ffffff"/>
<text x="480.0" y="32" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#1f2933" >eight_bit_divider: top-level interface</text>
<text x="480.0" y="54" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#8a94a3" >Ports and widths from the GLS testbench; register count from the Conformal LEC report</text>
<rect x="330" y="85" width="300" height="300" rx="6" fill="#ffffff" stroke="#1f2933" stroke-width="2"/>
<text x="480.0" y="113" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#1f2933" >eight_bit_divider</text>
<rect x="355" y="135" width="250" height="85" rx="6" fill="#fdf3e7" stroke="#b45309" stroke-width="1.5"/>
<text x="480.0" y="157" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2933" >Sequential control</text>
<text x="480.0" y="175" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1f2933" >start-triggered, done-reporting</text>
<text x="480.0" y="193" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1f2933" >(state encoding: RTL not in repo)</text>
<rect x="355" y="235" width="250" height="85" rx="6" fill="#eef3f9" stroke="#1d4e89" stroke-width="1.5"/>
<text x="480.0" y="257" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2933" >Iterative datapath</text>
<text x="480.0" y="275" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1f2933" >8-bit unsigned division</text>
<text x="480.0" y="293" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1f2933" >(internal structure: RTL not in repo)</text>
<text x="480.0" y="347" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1f2933" >47 flip-flops (LEC DFF compare points)</text>
<text x="480.0" y="367" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1f2933" >17 primary outputs = q[7:0] + p[7:0] + done</text>
<line x1="150" y1="125" x2="330" y2="125" stroke="#b45309" stroke-width="1.6" marker-end="url(#ac)"/>
<text x="142" y="129" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="end" font-weight="bold" fill="#b45309" >clk</text>
<text x="142" y="145" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="end" font-weight="normal" fill="#8a94a3" >clock (10 ns period in GLS)</text>
<line x1="150" y1="181" x2="330" y2="181" stroke="#b45309" stroke-width="1.6" marker-end="url(#ac)"/>
<text x="142" y="185" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="end" font-weight="bold" fill="#b45309" >rst</text>
<text x="142" y="201" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="end" font-weight="normal" fill="#8a94a3" >reset (active high in GLS)</text>
<line x1="150" y1="237" x2="330" y2="237" stroke="#b45309" stroke-width="1.6" marker-end="url(#ac)"/>
<text x="142" y="241" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="end" font-weight="bold" fill="#b45309" >start</text>
<text x="142" y="257" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="end" font-weight="normal" fill="#8a94a3" >one-cycle start pulse</text>
<line x1="150" y1="293" x2="330" y2="293" stroke="#1d4e89" stroke-width="2.2" marker-end="url(#ad)"/>
<line x1="288" y1="286" x2="296" y2="300" stroke="#1d4e89" stroke-width="1.4"/><text x="292" y="283" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#1d4e89" >8</text>
<text x="142" y="297" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="end" font-weight="bold" fill="#1d4e89" >x[7:0]</text>
<text x="142" y="313" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="end" font-weight="normal" fill="#8a94a3" >dividend</text>
<line x1="150" y1="349" x2="330" y2="349" stroke="#1d4e89" stroke-width="2.2" marker-end="url(#ad)"/>
<line x1="288" y1="342" x2="296" y2="356" stroke="#1d4e89" stroke-width="1.4"/><text x="292" y="339" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#1d4e89" >8</text>
<text x="142" y="353" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="end" font-weight="bold" fill="#1d4e89" >y[7:0]</text>
<text x="142" y="369" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="end" font-weight="normal" fill="#8a94a3" >divisor</text>
<line x1="630" y1="155" x2="810" y2="155" stroke="#1d4e89" stroke-width="2.2" marker-end="url(#ad)"/>
<line x1="664" y1="148" x2="672" y2="162" stroke="#1d4e89" stroke-width="1.4"/><text x="668" y="145" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#1d4e89" >8</text>
<text x="818" y="159" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="bold" fill="#1d4e89" >q[7:0]</text>
<text x="818" y="175" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#8a94a3" >quotient</text>
<line x1="630" y1="235" x2="810" y2="235" stroke="#1d4e89" stroke-width="2.2" marker-end="url(#ad)"/>
<line x1="664" y1="228" x2="672" y2="242" stroke="#1d4e89" stroke-width="1.4"/><text x="668" y="225" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#1d4e89" >8</text>
<text x="818" y="239" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="bold" fill="#1d4e89" >p[7:0]</text>
<text x="818" y="255" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#8a94a3" >remainder</text>
<line x1="630" y1="315" x2="810" y2="315" stroke="#b45309" stroke-width="1.6" marker-end="url(#ac)"/>
<text x="818" y="319" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="bold" fill="#b45309" >done</text>
<text x="818" y="335" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#8a94a3" >operation complete</text>
<line x1="40" y1="420" x2="70" y2="420" stroke="#1d4e89" stroke-width="2.2"/><text x="78" y="424" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2933" >data</text>
<line x1="140" y1="420" x2="170" y2="420" stroke="#b45309" stroke-width="1.6"/><text x="178" y="424" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2933" >control / clock</text>
<text x="920" y="424" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="end" font-weight="normal" fill="#8a94a3" >Internal blocks are shown at the level the evidence supports; no RTL is in the repository.</text>
</svg>
